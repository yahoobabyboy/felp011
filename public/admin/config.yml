---
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: yahoobabyboy/felp011
  branch: main
  base_url: https://auth-felp011.pbg2zv88z5.workers.dev

media_folder: /public/media
public_folder: /media

i18n:
  structure: multiple_folders
  locales: [en, pt, fr]
  default_locale: en

collections:
  # ---------------------------------------------------------------- pieces
  - name: pieces
    label: Portfolio
    label_singular: Work
    folder: /src/content/pieces
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    i18n: true
    preview_path: '/{{locale}}/portfolio/{{slug}}'
    view_filters:
      - label: Featured
        field: featured
        pattern: true
      - label: Commissions
        field: category
        pattern: commission
    summary: '{{title}} — {{medium}} ({{year}})'
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Summary, name: summary, widget: text, required: false, i18n: true, hint: "One or two sentences. Shown on the portfolio grid and used for link previews." }
      - { label: Cover image, name: cover, widget: image, required: false, i18n: false, choose_url: false, hint: "Main image. 4:5 portrait works best. Landscape is fine too." }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        i18n: false
        minimize_collapsed: true
        field: { label: Image, name: image, widget: image, choose_url: false }
      - { label: Medium, name: medium, widget: string, required: false, i18n: false }
      - { label: Year, name: year, widget: number, required: false, value_type: int, i18n: false }
      - { label: Dimensions, name: dimensions, widget: string, required: false, i18n: false, hint: "e.g. 40 × 50 cm" }
      - { label: Series, name: series, widget: string, required: false, i18n: false }
      - { label: Price, name: price, widget: string, required: false, i18n: false, hint: "e.g. €420 — leave empty to hide" }
      - { label: Available, name: available, widget: boolean, default: true, i18n: false }
      - label: Section
        name: category
        widget: select
        default: artwork
        options:
          - { label: "Artwork (your own work)", value: artwork }
          - { label: "Selected clients (commissioned)", value: commission }
        i18n: false
      - label: Client
        name: client
        widget: string
        required: false
        i18n: false
        hint: "Only for commissioned work. Make sure you have permission to publish these images."
      - { label: Role, name: role, widget: string, required: false, i18n: false }
      - { label: Featured, name: featured, widget: boolean, default: false, i18n: false, hint: "Shows on the home page." }
      - { label: "Order (lower = first)", name: order, widget: number, required: false, value_type: int, default: 0, i18n: false }
      - { label: Draft, name: draft, widget: boolean, default: false, i18n: false }
      - { label: Description, name: body, widget: markdown, required: false, i18n: true }

  # --------------------------------------------------------------- stories
  - name: stories
    label: Stories
    label_singular: Story
    folder: /src/content/stories
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    i18n: true
    preview_path: '/{{locale}}/stories/{{slug}}'
    summary: '{{title}} — {{date}}'
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Excerpt, name: excerpt, widget: text, required: false, i18n: true }
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, required: false, i18n: false }
      - { label: Cover image, name: cover, widget: image, required: false, i18n: false, choose_url: false }
      - label: Tags
        name: tags
        widget: list
        required: false
        i18n: false
        default: []
        field: { label: Tag, name: tag, widget: string }
      - { label: "Order (lower = first)", name: order, widget: number, required: false, value_type: int, default: 0, i18n: false }
      - { label: Draft, name: draft, widget: boolean, default: false, i18n: false }
      - { label: Body, name: body, widget: markdown, required: false, i18n: true }

  # -------------------------------------------------------------- products
  - name: products
    label: Shop
    label_singular: Product
    folder: /src/content/products
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    i18n: true
    summary: '{{title}} — {{price}} ({{status}})'
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Price, name: price, widget: string, required: false, i18n: false, hint: "e.g. €120 or 'From €80'" }
      - { label: Image, name: cover, widget: image, required: false, i18n: false, choose_url: false }
      - label: Status
        name: status
        widget: select
        default: coming_soon
        options:
          - { label: "Coming soon", value: coming_soon }
          - { label: "Available to buy", value: available }
        i18n: false
      - label: Buy link
        name: buyLink
        widget: string
        required: false
        i18n: false
        hint: "Paste a Stripe Payment Link or Gumroad link here. Leave empty until ready."
      - { label: "Order (lower = first)", name: order, widget: number, required: false, value_type: int, default: 0, i18n: false }
      - { label: Draft, name: draft, widget: boolean, default: false, i18n: false }
      - { label: Details, name: details, widget: markdown, required: false, i18n: true }

# ------------------------------------------------------------------ files
# `singletons`, not a top-level `file:`. The published Sveltia schema sets
# additionalProperties:false on CmsConfig and has no `file` key, so the old
# form was a hard config error and "Site settings" never rendered. Both
# single files are now reachable from the collection list.
singletons:
  - name: site
    label: Site settings
    file: /src/content/site/site.md
    fields:
      - { label: "Brand (logo text)", name: brand, widget: string, i18n: false, default: FELP011 }
      - { label: "Full name", name: name, widget: string, i18n: false }
      - label: Tagline
        name: tagline
        widget: object
        i18n: false
        fields:
          - { label: English, name: en, widget: string }
          - { label: "Português", name: pt, widget: string }
          - { label: "Français", name: fr, widget: string }
      - label: Bio
        name: bio
        widget: object
        i18n: false
        fields:
          - { label: English, name: en, widget: text }
          - { label: "Português", name: pt, widget: text }
          - { label: "Français", name: fr, widget: text }
      - { label: "Contact email", name: email, widget: string }
      - label: Locations
        name: locations
        widget: list
        i18n: false
        default: ["Paris, France", "São Paulo, Brasil"]
        field: { label: Location, name: loc, widget: string }
      - label: Social links
        name: socials
        widget: list
        required: false
        i18n: false
        # `fields`, not `field`: two different subfields per row. `field` is
        # for a single repeated shape (see Locations above).
        fields:
          - { label: Label, name: label, widget: string, hint: "e.g. Instagram" }
          - { label: URL, name: url, widget: string }
      - label: Page text
        name: pages
        widget: object
        i18n: false
        collapsed: true
        fields:
          - label: About
            name: about
            widget: object
            i18n: false
            fields:
              - { label: English, name: en, widget: text }
              - { label: "Português", name: pt, widget: text }
              - { label: "Français", name: fr, widget: text }
          - label: Contact
            name: contact
            widget: object
            i18n: false
            fields:
              - { label: English, name: en, widget: text }
              - { label: "Português", name: pt, widget: text }
              - { label: "Français", name: fr, widget: text }
          - label: Shop
            name: shop
            widget: object
            i18n: false
            fields:
              - { label: English, name: en, widget: text }
              - { label: "Português", name: pt, widget: text }
              - { label: "Français", name: fr, widget: text }

  # ---------------------------------------------------------------- design
  # Every field here writes a CSS custom property defined in
  # src/styles/global.css. global.css keeps every default, so clearing a
  # colour here falls back to the built-in value rather than to nothing.
  - name: design
    label: Design
    file: /src/content/design/design.md
    fields:
      - label: Colours (light)
        name: light
        widget: object
        i18n: false
        collapsed: false
        hint: "Used in normal mode. Change these AND the dark set below, or the two will drift apart."
        fields:
          - { label: Page background, name: bg, widget: color, allowInput: true, i18n: false }
          - { label: Raised background, name: bgRaised, widget: color, allowInput: true, i18n: false, hint: "Cards, inputs." }
          - { label: Sunken background, name: bgSunken, widget: color, allowInput: true, i18n: false, hint: "Code blocks, image placeholders." }
          - { label: Text, name: ink, widget: color, allowInput: true, i18n: false }
          - { label: Soft text, name: inkSoft, widget: color, allowInput: true, i18n: false }
          - { label: Muted text, name: inkMuted, widget: color, allowInput: true, i18n: false, hint: "Captions, meta, labels." }
          - { label: Faint text, name: inkFaint, widget: color, allowInput: true, i18n: false }
          - { label: Hairline, name: line, widget: color, allowInput: true, i18n: false, hint: "Borders and rules." }
          - { label: Strong hairline, name: lineStrong, widget: color, allowInput: true, i18n: false }
          - { label: Accent, name: accent, widget: color, allowInput: true, i18n: false, hint: "Buttons, hover, links." }
          - { label: Soft accent, name: accentSoft, widget: color, allowInput: true, i18n: false }
          - { label: Accent text, name: accentInk, widget: color, allowInput: true, i18n: false, hint: "Link colour on light backgrounds — needs contrast against bg." }
      - label: Colours (dark)
        name: dark
        widget: object
        i18n: false
        collapsed: false
        hint: "Applied when the visitor's device prefers dark mode."
        fields:
          - { label: Page background, name: bg, widget: color, allowInput: true, i18n: false }
          - { label: Raised background, name: bgRaised, widget: color, allowInput: true, i18n: false }
          - { label: Sunken background, name: bgSunken, widget: color, allowInput: true, i18n: false }
          - { label: Text, name: ink, widget: color, allowInput: true, i18n: false }
          - { label: Soft text, name: inkSoft, widget: color, allowInput: true, i18n: false }
          - { label: Muted text, name: inkMuted, widget: color, allowInput: true, i18n: false }
          - { label: Faint text, name: inkFaint, widget: color, allowInput: true, i18n: false }
          - { label: Hairline, name: line, widget: color, allowInput: true, i18n: false }
          - { label: Strong hairline, name: lineStrong, widget: color, allowInput: true, i18n: false }
          - { label: Accent, name: accent, widget: color, allowInput: true, i18n: false }
          - { label: Soft accent, name: accentSoft, widget: color, allowInput: true, i18n: false }
          - { label: Accent text, name: accentInk, widget: color, allowInput: true, i18n: false }
      - label: Fonts
        name: type
        widget: object
        i18n: false
        collapsed: true
        fields:
          - label: Headings
            name: fontDisplay
            widget: select
            i18n: false
            hint: "All stacks are built-in system fonts, so nothing is downloaded and nothing blocks first paint."
            options:
              - label: Old-style serif — Iowan / Palatino
                value: '"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif'
              - label: Transitional serif — Georgia / Times
                value: 'Georgia, "Times New Roman", Times, serif'
              - label: Didone serif — Didot / Bodoni
                value: '"Didot", "Bodoni MT", "Playfair Display", Garamond, Georgia, serif'
          - label: Body text
            name: fontBody
            widget: select
            i18n: false
            options:
              - label: System sans — San Francisco / Segoe
                value: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
              - label: Grotesk — Helvetica Neue / Arial
                value: '"Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif'
              - label: Humanist sans — Optima / Gill Sans
                value: '"Optima", "Gill Sans", "Gill Sans MT", "Trebuchet MS", sans-serif'
          - { label: Monospace, name: fontMono, widget: string, i18n: false }
          - label: Type scale
            name: scale
            widget: object
            i18n: false
            collapsed: true
            hint: "Fluid sizes. Each is a clamp() of min, viewport-relative size, max. The prefix is how many steps below body text."
            fields:
              - { label: Small, name: stepMinus1, widget: string, i18n: false }
              - { label: Body, name: step0, widget: string, i18n: false }
              - { label: "Step 1", name: step1, widget: string, i18n: false }
              - { label: "Step 2", name: step2, widget: string, i18n: false }
              - { label: "Step 3", name: step3, widget: string, i18n: false }
              - { label: "Step 4 (largest)", name: step4, widget: string, i18n: false }
      - label: Layout
        name: layout
        widget: object
        i18n: false
        collapsed: true
        fields:
          - { label: Page width, name: page, widget: string, i18n: false, hint: "Max content width, e.g. 1240px." }
          - { label: Text measure, name: measure, widget: string, i18n: false, hint: "Ideal line length for prose, e.g. 62ch. Lower is easier to read." }
          - { label: Side gutters, name: gutter, widget: string, i18n: false }
          - { label: Corner radius, name: radius, widget: string, i18n: false, hint: "0 for sharp corners, 12px for rounded." }
